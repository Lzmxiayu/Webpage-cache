services:
  mysql:
    image: mysql:8.4
    container_name: screenshot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webpage_cache
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../internal/repository/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2
    container_name: screenshot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: screenshot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_DSN: app:app@tcp(mysql:3306)/webpage_cache?charset=utf8mb4&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_QUEUE_KEY: screenshot:tasks
      WORKER_COUNT: "5"
      BROWSER_POOL_SIZE: "2"
      MAX_TABS_PER_BROWSER: "3"
      PROXY_URLS: ""
      MAX_RETRY_COUNT: "2"
      SHOT_TIMEOUT_SEC: "30"
      PAGE_RENDER_WAIT_MS: "2000"
      TASK_TIMEOUT_SEC: "45"
      SHUTDOWN_TIMEOUT_SEC: "10"
      SCREENSHOT_DIR: /app/data/screenshots
      SCREENSHOT_BASE_URL: /static/screenshots
      HTTP_ADDR: :8080
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - screenshots_data:/app/data/screenshots

volumes:
  mysql_data:
  redis_data:
  screenshots_data:
